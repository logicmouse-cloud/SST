<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SST Registration - Kiosk HD</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="static/css/bootstrap-icons.css">
    <link rel="stylesheet" href="static/css/simple-keyboard.css">
    
    <style>
        :root {
            --brand-color: #00d4ff;
            --bg-dark: #020617;
            --card-bg: #1e293b;
            --panel-bg: #0f172a;
            --input-bg: #020617;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-dark);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        /* Optimized Grid for vertical 1200px limit */
        .kiosk-grid { 
            display: grid; 
            grid-template-columns: 440px 1fr 440px; 
            width: 100%; 
            height: 100%; 
            gap: 30px; 
            padding: 35px; /* Reduced from 50px */
            box-sizing: border-box;
        }

        /* Left Zone: Brand */
        .brand-zone { 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            background: rgba(30, 41, 59, 0.3);
            padding: 50px; /* Reduced from 60px */
            border-radius: 40px;
            border: 2px solid rgba(255,255,255,0.05);
        }
        .logo-text { font-size: 3.8rem; font-weight: 900; color: var(--brand-color); line-height: 0.95; text-transform: uppercase; }

        /* Middle Zone: Form & Keyboard */
        .form-zone {
            background: var(--panel-bg);
            border-radius: 50px;
            border: 4px solid #334155;
            padding: 45px; /* Reduced from 60px */
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .form-label { font-size: 1.5rem; color: var(--brand-color); font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
        
        .form-control {
            height: 80px; /* Reduced from 100px */
            font-size: 2.2rem; /* Scaled down slightly */
            border-radius: 20px;
            background: var(--input-bg) !important;
            border: 3px solid #334155;
            color: white !important;
            padding: 0 30px;
        }

        /* Virtual Keyboard Scaling */
        .simple-keyboard {
            background-color: transparent !important;
            padding-top: 30px;
        }

        .hg-theme-default .hg-button {
            height: 75px !important; /* Reduced from 90px to fit 1200px height */
            font-size: 1.8rem !important;
            background: #1e293b !important;
            border-bottom: 5px solid #020617 !important;
            margin: 5px !important;
        }

        /* Right Zone Adjustments */
        .info-panel {
            background: rgba(30, 41, 59, 0.4);
            border-radius: 40px;
            padding: 40px;
            border: 3px solid #334155;
            text-align: center;
        }

        .btn-register {
            height: 135px; /* Reduced from 160px */
            font-size: 3rem;
            border-radius: 35px;
            background: var(--brand-color);
            color: #000;
            font-weight: 900;
        }

        .btn-cancel { height: 85px; font-size: 1.6rem; border-radius: 40px; }

        .input-active { border-color: var(--brand-color) !important; border-width: 4px !important; }
    </style>
</head>
<body>

    <div class="kiosk-grid">
        <div class="brand-zone">
            <div>
                <div class="logo-text">PASN<br>SNACK<br>STATION</div>
                <div class="mt-4 border-start border-info border-5 ps-4">
                    <p class="fs-3 text-white-50">REGISTRATION<br>KIOSK v2.12</p>
                </div>
            </div>
            <a href="/login" class="btn btn-outline-light btn-cancel fw-bold d-flex align-items-center justify-content-center">
                <i class="bi bi-arrow-left-circle me-3"></i> EXIT TO LOGIN
            </a>
        </div>

        <div class="form-zone shadow-lg">
            <h1 class="display-4 fw-bold mb-4"><i class="bi bi-person-plus text-info me-2"></i>Create Account</h1>

            <form action="/register_user" method="POST" id="regForm" autocomplete="off">
                <div class="row g-4">
                    <div class="col-12">
                        <label class="form-label">Scan Card or Enter ID</label>
                        <input type="text" name="card_id" id="card_id" class="form-control use-keyboard-input" 
                               value="{{ prefill_card }}" placeholder="Waiting for card..." required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" id="name" class="form-control use-keyboard-input" placeholder="e.g. DAVID SMITH" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" id="email" class="form-control use-keyboard-input" placeholder="STAFF@NZ.GOVT.NZ" required>
                    </div>
                </div>
            </form>

            <div class="simple-keyboard hg-theme-default"></div>
        </div>

        <div class="status-zone d-flex flex-column gap-3">
            <div class="info-panel flex-grow-1 d-flex flex-column align-items-center justify-content-center">
                <i class="bi bi-shield-check text-info mb-3" style="font-size: 8rem;"></i>
                <h2 class="fw-bold">SECURE</h2>
                <p class="text-white-50 fs-4 mt-3">Locked to your ID card instantly.</p>
            </div>
            <button type="button" onclick="document.getElementById('regForm').submit()" class="btn btn-register w-80 text-center shadow-lg">
                COMPLETE<br>ENROLLMENT
            </button>
        </div>
    </div>

    <script src="static/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/simple-keyboard.js"></script>

    <script>
        const Keyboard = window.SimpleKeyboard.default;
        let selectedInput;
        let keyboard;
        let shiftActive = false;

        document.addEventListener("DOMContentLoaded", () => {
            keyboard = new Keyboard({
                onChange: input => { if (selectedInput) selectedInput.value = input; },
                onKeyPress: button => {
                    if (button === "{ent}") selectedInput.blur();
                    else if (button === "{shift}") {
                        keyboard.setOptions({ layoutName: "shift" });
                        shiftActive = true;
                    } else if (shiftActive && !button.startsWith("{") && button.length === 1) {
                        keyboard.setOptions({ layoutName: "default" });
                        shiftActive = false;
                    }
                },
                layout: {
                    'default': [
                        '1 2 3 4 5 6 7 8 9 0 {backspace}',
                        'q w e r t y u i o p',
                        'a s d f g h j k l',
                        'z x c v b n m @ .',
                        '{shift} {space} {ent}'
                    ],
                    'shift': [
                        '1 2 3 4 5 6 7 8 9 0 {backspace}',
                        'Q W E R T Y U I O P',
                        'A S D F G H J K L',
                        'Z X C V B N M @ .',
                        '{shift} {space} {ent}'
                    ]
                },
                display: {
                    '{backspace}': '⌫',
                    '{ent}': 'OK ✓',
                    '{shift}': 'Shift',
                    '{space}': 'SPACE'
                }
            });

            document.querySelectorAll(".use-keyboard-input").forEach(input => {
                input.addEventListener("focus", (e) => {
                    selectedInput = e.target;
                    document.querySelectorAll(".use-keyboard-input").forEach(el => el.classList.remove('input-active'));
                    selectedInput.classList.add('input-active');
                    keyboard.setOptions({ inputName: e.target.id });
                    keyboard.setInput(e.target.value);
                });
            });
        });
    </script>
</body>
</html>
